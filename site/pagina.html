<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Camarim · LA Music</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0A0708; --surface:#15100F; --surface-2:#1D1615; --line:#2C2021;
  --red:#E23127; --paper:#F6F2F0; --text:#EDE6E4; --muted:#9C8B88;
  --display:'Anton','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --gut:clamp(20px,5vw,64px); --maxw:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
body[data-estado="previa"] .so-liberado{display:none!important}
body[data-estado="liberado"] .so-previa{display:none!important}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(32px,5vw,58px);line-height:.94;letter-spacing:.015em;margin:6px 0 0;text-wrap:balance}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ---------- marca da escola, sempre visível ---------- */
.topo{
  position:absolute;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;gap:12px;padding:18px var(--gut);
}
.topo .marca{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.topo .marca i{color:var(--red);font-style:normal}
.topo .ev{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:12px;border-left:1px solid var(--line)}
@media(max-width:560px){.topo .ev{display:none}}

/* ---------- barra fixa ---------- */
.bar{
  position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:11px var(--gut);background:rgba(10,7,8,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);transform:translateY(-102%);transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
.bar.on{transform:none}
.bar .bn{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:21px;letter-spacing:.035em;line-height:1}
.bar .sp{flex:1}
@media(max-width:620px){
  .bar{padding:9px 16px}
  .bar .bn{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  .bar .btn{padding:11px 14px;font-size:13.5px;white-space:nowrap}
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--body);font-weight:600;font-size:14px;padding:12px 18px;border-radius:2px;
  border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;text-decoration:none;
  transition:background .18s,border-color .18s;
}
.btn:hover{border-color:var(--muted);background:var(--surface-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#F03D33;border-color:#F03D33}
.btn.dark{background:#0A0708;border-color:#0A0708;color:var(--paper)}
.btn.dark:hover{background:#2C2021;border-color:#2C2021}
.btn.big{font-size:16px;padding:17px 26px;width:100%}
.btn svg{width:16px;height:16px;flex:none}

/* ---------- capa ---------- */
.hero{position:relative;min-height:min(92vh,860px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero-img{position:absolute;inset:0}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:center 34%}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,8,.72) 0%,rgba(10,7,8,.14) 32%,rgba(10,7,8,.88) 74%,var(--ink) 100%)}
.hero-in{position:relative;padding-top:130px;padding-bottom:clamp(28px,5vw,60px);width:100%}
@media(max-width:620px){.hero-in{padding-top:96px;padding-bottom:34px}}
.selo{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text);background:rgba(10,7,8,.68);
  border:1px solid var(--line);padding:7px 12px;border-radius:2px;margin-bottom:clamp(16px,3.5vw,32px);
}
.selo .pt{width:6px;height:6px;flex:none;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(226,49,39,.2)}
.hero h1{
  font-family:var(--display);font-weight:400;text-transform:uppercase;
  font-size:clamp(50px,13vw,175px);line-height:.88;letter-spacing:.008em;
  margin:0 0 14px;text-wrap:balance;text-shadow:0 4px 40px rgba(10,7,8,.6);overflow-wrap:anywhere;
}
.hero .oque{font-size:clamp(16px,2.2vw,20px);color:var(--text);margin:0 0 8px;max-width:34ch;font-weight:500}
.hero .quando{font-family:var(--mono);font-size:clamp(11px,1.4vw,13px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 24px}
.hero .quando b{color:var(--red);font-weight:500}
.stats{display:grid;grid-auto-flow:column;justify-content:start;border-top:1px solid var(--line)}
.stat{padding:15px 24px 4px 0;margin-right:24px;border-right:1px solid var(--line);padding-right:24px}
.stat:last-child{border-right:0;margin-right:0}
.stat .n{font-weight:700;font-size:29px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:5px}
@media(max-width:620px){
  .stats{grid-auto-flow:row;grid-template-columns:1fr 1fr}
  .stat{margin:0;padding:13px 14px 13px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat:nth-child(2n){border-right:0;padding-left:14px}
  .stat:nth-last-child(-n+2){border-bottom:0}
}

/* ---------- explicação ---------- */
.explica{background:var(--surface);border-bottom:1px solid var(--line)}
.explica .in{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,40px);padding-top:clamp(30px,4vw,44px);padding-bottom:clamp(30px,4vw,44px)}
@media(max-width:820px){.explica .in{grid-template-columns:1fr;gap:22px}}
.passo{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.passo .num{
  width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--red);color:var(--red);
  display:grid;place-items:center;font-family:var(--display);font-size:15px;padding-top:2px;
}
.passo b{display:block;font-size:15.5px;margin-bottom:3px}
.passo span{font-size:14px;color:var(--muted);display:block}

/* ---------- seções ---------- */
section{padding:clamp(50px,7vw,96px) 0;scroll-margin-top:70px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(22px,3.2vw,36px)}
.sec-head p{color:var(--muted);font-size:14.5px;max-width:48ch;margin:10px 0 0}

/* vídeo */
.player{position:relative;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.player video,.player img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.player .tarja{
  position:absolute;left:0;right:0;bottom:0;padding:18px 20px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(10,7,8,.92));
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
}
.vids{display:grid;margin-top:26px;border-top:1px solid var(--line)}
.vrow{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:16px 4px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;
  background:transparent;color:var(--text);font-family:var(--body);font-size:15px;cursor:pointer;
  transition:background .18s,padding-left .18s;
}
.vrow:hover{background:var(--surface);padding-left:12px}
.vrow[aria-current="true"]{background:var(--surface)}
.vrow[aria-current="true"] .vt{color:var(--red)}
.vrow.trancado .vt{color:var(--muted)}
.vnum{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vt{font-weight:600}
.vd{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.vlock{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);
  padding:5px 9px;border-radius:2px;white-space:nowrap}
.vlock svg{width:11px;height:11px;flex:none}
@media(max-width:560px){
  .vrow{gap:12px;font-size:14px;grid-template-columns:auto 1fr auto}
  .vlock span{display:none}
}
.editando{border:1px dashed var(--line);background:var(--surface);padding:clamp(40px,7vw,80px) 24px;text-align:center}
.editando .big{font-family:var(--display);font-size:clamp(24px,3.4vw,34px);letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
.editando span{color:var(--muted);font-size:14.5px;display:block;max-width:44ch;margin:0 auto}
.sob{margin-top:14px;color:var(--muted);font-size:14px}

/* fotos */
.aviso{
  display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);
  border-left:3px solid var(--red);background:var(--surface);padding:16px 18px;margin:0 0 24px;
}
.aviso .ic{width:26px;height:26px;flex:none;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.aviso b{display:block;font-size:15.5px;margin-bottom:2px}
.aviso span{font-size:14px;color:var(--muted);display:block;max-width:70ch}
.grid{columns:3;column-gap:14px}
@media(max-width:860px){.grid{columns:2}}
@media(max-width:520px){.grid{columns:1}}
.cell{break-inside:avoid;margin:0 0 14px;position:relative;display:block;width:100%;padding:0;border:0;background:var(--surface);cursor:zoom-in;overflow:hidden}
.cell img{width:100%;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.cell:hover img{transform:scale(1.04)}
.cell .tg{
  position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;background:var(--paper);color:#0A0708;padding:5px 8px;font-weight:500;
}
.mais{
  break-inside:avoid;margin:0 0 14px;border:1px dashed var(--line);background:var(--surface);
  display:grid;place-items:center;text-align:center;padding:44px 20px;gap:6px;
}
.mais .n{font-family:var(--display);font-size:44px;line-height:1}
.mais .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

/* ---------- pacotes ---------- */
.paper{background:var(--paper);color:#14100F}
.paper .eyebrow{color:#7A6B67}
.paper h2.sec{color:#14100F}
.oferta-head p{color:#5C4F4C;font-size:15.5px;max-width:52ch;margin:12px 0 0}
.prazo-topo{
  display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:#14100F;color:var(--paper);padding:7px 12px;margin-top:18px;
}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
@media(max-width:1000px){.tiers{grid-template-columns:1fr;gap:20px}}
.tier{border:1px solid rgba(20,16,15,.16);padding:26px 24px 24px;display:flex;flex-direction:column;gap:15px;background:#FFF}
.tier.hi{border:2px solid #14100F;position:relative}
.tier.hi::after{content:"Mais completo";position:absolute;top:-11px;left:22px;background:var(--red);color:#fff;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px}
.tier .tn{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:27px;line-height:1;letter-spacing:.02em}
.tier .pv{font-family:var(--display);font-size:44px;line-height:.9;letter-spacing:.01em}
.tier ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14.5px;color:#3A312F;flex:1}
.tier li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tier li svg{width:14px;height:14px;margin-top:5px;flex:none;color:var(--red)}
.um-paga{display:flex;gap:14px;align-items:flex-start;border:1px solid rgba(20,16,15,.18);border-left:3px solid var(--red);background:#fff;padding:18px 20px;margin-top:24px}
.um-paga .ic{width:30px;height:30px;flex:none;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:17px;padding-top:2px}
.um-paga b{display:block;font-size:16.5px;color:#14100F;margin-bottom:3px}
.um-paga span{font-size:14px;color:#5C4F4C;max-width:66ch;display:block}
.nota{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid rgba(20,16,15,.14);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7A6B67}

/* ---------- liberado ---------- */
.liberado{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--red);background:var(--surface);padding:18px 20px;margin-top:clamp(26px,4vw,40px)}
.liberado .ok{width:26px;height:26px;flex:none;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.liberado .l1{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.liberado .l1 b{color:var(--text)}
.liberado .l2{color:var(--muted);font-size:13.5px;margin-top:4px}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:720px){.dl{grid-template-columns:1fr}}
.dl a{background:var(--ink);padding:26px 24px;text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:background .2s;cursor:pointer}
.dl a:hover{background:var(--surface)}
.dl .t{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:25px;line-height:1.08;letter-spacing:.02em}
.dl .d{color:var(--muted);font-size:13.5px}
.dl .s{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-top:8px}

/* ---------- créditos ---------- */
.cred{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,4vw,56px);align-items:start}
@media(max-width:800px){.cred{grid-template-columns:1fr}}
.cbox{background:var(--paper);color:#14100F;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.9;border-radius:2px;margin-top:20px;word-break:break-word}
.crow{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.copiado{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);opacity:0;transition:opacity .2s}
.copiado.on{opacity:1}
.equipe{display:grid;grid-template-columns:auto 1fr;gap:12px 22px;border-top:1px solid var(--line);padding-top:18px;margin-top:14px;font-size:15px}
.equipe dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.equipe dd{margin:0;font-weight:500}

footer{border-top:1px solid var(--line);padding:40px 0 60px;color:var(--muted);font-size:13.5px}
.foot{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;align-items:flex-end}
.foot .mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.foot .mono b{color:var(--text);font-weight:500}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:90;background:rgba(6,4,5,.985);backdrop-filter:blur(8px);display:none;place-items:center;padding:clamp(16px,4vw,56px)}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:84vh;object-fit:contain}
.lb .top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,32px);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lb button.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,7,8,.6);border:1px solid var(--line);color:var(--text);width:50px;height:50px;cursor:pointer;font-size:20px;border-radius:2px}
.lb .prev{left:clamp(8px,2vw,26px)}.lb .next{right:clamp(8px,2vw,26px)}
.lb .x{background:transparent;border:0;color:var(--text);font-size:28px;cursor:pointer;line-height:1;padding:0 6px}

/* ---------- modal WhatsApp ---------- */
.zap{position:fixed;inset:0;z-index:95;background:rgba(6,4,5,.9);backdrop-filter:blur(10px);display:none;place-items:center;padding:clamp(14px,3vw,40px);overflow-y:auto}
.zap.on{display:grid}
.zcard{background:var(--paper);color:#14100F;width:min(620px,100%);padding:clamp(24px,3.4vw,38px);position:relative;border-radius:2px}
.zx{position:absolute;top:14px;right:16px;background:transparent;border:0;font-size:26px;line-height:1;cursor:pointer;color:#5C4F4C;padding:0 6px}
.zcard .eyebrow{color:#7A6B67}
.zcard h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(26px,3.2vw,36px);line-height:1;letter-spacing:.02em;margin:8px 0 4px}
.zval{font-family:var(--display);font-size:clamp(32px,4.2vw,46px);line-height:1;color:var(--red);margin-bottom:20px}
.zbody{border-top:1px solid rgba(20,16,15,.14);padding-top:22px}
.zbody p{margin:0 0 16px;font-size:14.5px;color:#3A312F;max-width:52ch}
.zmsg{background:#14100F;color:var(--paper);padding:16px;font-family:var(--mono);font-size:12.5px;line-height:1.8;border-radius:2px;margin:10px 0 18px}
.zkey{display:flex;gap:13px;align-items:flex-start;border:1px solid rgba(20,16,15,.18);border-left:3px solid var(--red);background:#fff;padding:16px 18px;margin:0 0 20px}
.zkey .ic{width:28px;height:28px;flex:none;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:16px;padding-top:2px}
.zkey b{display:block;font-size:15.5px;color:#14100F;margin-bottom:3px}
.zkey span{font-size:13.5px;color:#5C4F4C;display:block}
.zgo{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#14100F;color:var(--paper);border:1px solid #14100F;border-radius:2px;font-weight:600;font-size:16px;padding:17px 26px;cursor:pointer;text-decoration:none;transition:background .18s}
.zgo:hover{background:#2C2021}
.zgo svg{width:19px;height:19px;flex:none}
.zfoot{font-size:13px;color:#5C4F4C;margin:16px 0 0;max-width:56ch}

.carregando{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
.carregando .n{font-family:var(--display);font-size:clamp(28px,5vw,44px);text-transform:uppercase;margin-bottom:12px;color:var(--red)}
.carregando p{color:var(--muted);max-width:44ch;margin:0 auto}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-estado="previa">

<div id="app">
  <div class="carregando"><div><div class="n">Camarim</div><p>Carregando a página de vocês…</p></div></div>
</div>

<template id="tpl-pagina">
<div class="bar" id="bar">
  <span class="bn" id="barNome">BANDA</span>
  <span class="sp"></span>
  <a class="btn primary so-previa" href="#pacotes">Ver os pacotes</a>
  <a class="btn primary so-liberado" href="#baixar">Baixar material</a>
</div>

<header class="hero">
  <div class="topo">
    <span class="marca">L<i>A</i> Music</span>
    <span class="ev" id="topoEvento">Julina Rock Fest 2026</span>

    var partes=[],central=[],off=0;
    arqs.forEach(function(a){
      var nome=txt(a.nome),d=a.dados,crc=crc32(d);
      var lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
      lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);
      lh.setUint16(26,nome.length,true);
      partes.push(new Uint8Array(lh.buffer),nome,d);
      var ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
      ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);
      ch.setUint16(28,nome.length,true);ch.setUint32(42,off,true);
      central.push(new Uint8Array(ch.buffer),nome);
      off+=30+nome.length+d.length;
    });
    var tc=0; central.forEach(function(c){tc+=c.length;});
    var f=new DataView(new ArrayBuffer(22));
    f.setUint32(0,0x06054b50,true);f.setUint16(8,arqs.length,true);f.setUint16(10,arqs.length,true);
    f.setUint32(12,tc,true);f.setUint32(16,off,true);
    return new Blob(partes.concat(central,[new Uint8Array(f.buffer)]),{type:"application/zip"});
  }
  async function baixarFotosZip(fotos){
    var st = document.getElementById("stBaixarFotos");
    st.textContent = "preparando…";
    try{
      var arqs = [];
      for(var i=0;i<fotos.length;i++){
        st.textContent = "baixando "+(i+1)+" de "+fotos.length+"…";
        var resp = await fetch(fotos[i].url);
        var buf = new Uint8Array(await resp.arrayBuffer());
        var nome = String(i+1).padStart(2,"0")+"_"+(fotos[i].titulo||"foto.jpg");
        arqs.push({nome:nome, dados:buf});
      }
      st.textContent = "montando o arquivo…";
      var blob = fazZip(arqs);
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fotos.zip";
      document.body.appendChild(a); a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},4000);
      st.textContent = "baixado!";
    }catch(err){ st.textContent = "deu erro — tenta de novo"; }
  }

  /* ---- créditos ---- */
  document.getElementById("textoCreditos").innerHTML = (raw.creditos||[]).join("<br>");
  document.getElementById("equipe").innerHTML = (raw.equipe||[]).map(function(e){
    return '<dt>'+e[0]+'</dt><dd>'+e[1]+'</dd>';
  }).join("");
  document.getElementById("btCopiar").addEventListener("click", function(){
    var t = document.getElementById("textoCreditos").innerText;
    if (navigator.clipboard) { navigator.clipboard.writeText(t).catch(function(){}); }
    var c=document.getElementById("copiado"); c.classList.add("on");
    setTimeout(function(){ c.classList.remove("on"); }, 1800);
  });

  /* ---- WhatsApp ---- */
  var zap=document.getElementById("zap");
  function linkZap(txt){ return "https://wa.me/"+raw.whatsapp+"?text="+encodeURIComponent(txt); }
  function abreZap(i){
    var p = raw.pacotes[i];
    document.getElementById("zTier").textContent = p.nome;
    document.getElementById("zVal").textContent = "R$ " + p.preco;
    var msg = "Oi! Sou da banda " + raw.banda + " do " + raw.evento
            + ". Quero o pacote " + p.nome + " (R$ " + p.preco + "). Como faço pra pagar?";
    document.getElementById("zMsg").textContent = msg;
    document.getElementById("zGo").href = linkZap(msg);
    zap.classList.add("on");
  }
  document.addEventListener("click", function(e){
    var b=e.target.closest("[data-zap]"); if(!b) return;
    abreZap(+b.dataset.zap);
  });
  document.getElementById("zX").onclick=function(){zap.classList.remove("on")};
  zap.addEventListener("click",function(e){ if(e.target===zap) zap.classList.remove("on"); });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape" && zap.classList.contains("on")) zap.classList.remove("on");
  });
  document.getElementById("rodapeZap").href =
    linkZap("Oi! Sou da banda " + raw.banda + " do " + raw.evento + ". Queria falar sobre o material do show.");

  /* ---- barra fixa: aparece cedo no celular ---- */
  var bar=document.getElementById("bar");
  var gatilho = window.innerWidth < 700 ? 0.45 : 0.7;
  addEventListener("scroll", function(){
    bar.classList.toggle("on", scrollY > innerHeight * gatilho);
  }, {passive:true});
})();
</script>
